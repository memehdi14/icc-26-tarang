name: Firmware Build Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'release/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
      - master

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  static-analysis:
    name: Cppcheck Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Run Static Analysis
        run: |
          # Scan the firmware source directory
          cppcheck --enable=warning,style,performance,portability \
            --inconclusive \
            --suppress=missingIncludeSystem \
            --suppress=unknownMacro \
            "projects/tarang-firmware/Initial Firmware/"

  # ─────────────────────────────────────────────────────────────────────────────
  firmware-build:
    name: Firmware Compile Check
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache ~/.silabs
        uses: actions/cache@v4
        with:
          path: ~/.silabs
          key: silabs-${{ hashFiles('tools/pkg.lock', 'tools/pkg.slt') }}
          restore-keys: |
            silabs-

      - name: Download and Setup SLT-CLI
        run: |
          wget https://www.silabs.com/documents/public/software/slt-cli-1.1.0-linux-x64.zip -O slt-cli.zip
          unzip slt-cli.zip -d slt-cli
          chmod +x slt-cli/slt

      - name: Install SDK and Tools via SLT
        run: |
          if [ -f "tools/pkg.lock" ]; then
            echo "Installing from pkg.lock..."
            ./slt-cli/slt install -f tools/pkg.lock
          else
            echo "Warning: tools/pkg.lock not found. Falling back to tools/pkg.slt"
            ./slt-cli/slt install -f tools/pkg.slt
          fi

      - name: Set Tool Paths
        run: |
          SLC_CLI_DIR=$(./slt-cli/slt where slc-cli)
          JAVA_DIR=$(./slt-cli/slt where java21)
          COMMANDER_DIR=$(./slt-cli/slt where commander)
          GCC_DIR=$(./slt-cli/slt where gcc-arm-none-eabi)/bin
          NINJA_DIR=$(./slt-cli/slt where ninja)
          CMAKE_DIR=$(./slt-cli/slt where cmake)/bin
          
          if [ -f "$JAVA_DIR/bin/java" ]; then
            JAVA_BIN_DIR="$JAVA_DIR/bin"
          elif [ -f "$JAVA_DIR/jre/bin/java" ]; then
            JAVA_BIN_DIR="$JAVA_DIR/jre/bin"
          else
            JAVA_BIN_DIR=$(find "$JAVA_DIR" -name "java" -type f -executable -printf '%h\n' | head -n 1)
          fi
          echo "Java binary found at: $JAVA_BIN_DIR/java"
          
          echo "$JAVA_BIN_DIR" >> $GITHUB_PATH
          echo "$SLC_CLI_DIR" >> $GITHUB_PATH
          echo "$COMMANDER_DIR" >> $GITHUB_PATH
          echo "$GCC_DIR" >> $GITHUB_PATH
          echo "$NINJA_DIR" >> $GITHUB_PATH
          echo "$CMAKE_DIR" >> $GITHUB_PATH
          
          echo "JAVA_HOME=$JAVA_DIR" >> $GITHUB_ENV

      - name: Verify Java 21
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          echo "which java: $(which java)"
          java -version 2>&1
          java -version 2>&1 | grep -i "21\." || { echo "ERROR: Java 21 not active! System Java is overriding."; exit 1; }

      - name: Generate Project (slc generate)
        run: |
          slc generate -p "projects/tarang-firmware/Initial Firmware/Tarang_Core_Pipeline.slcp" \
            -d "projects/tarang-firmware/Initial Firmware/build" \
            --slconf tools/autogen/pkg.slconf

      - name: Build Firmware
        run: |
          cd "projects/tarang-firmware/Initial Firmware/build"
          
          if [ -d "cmake_gcc" ] && [ -f "cmake_gcc/CMakeLists.txt" ]; then
            echo "CMake project detected"
            cd cmake_gcc
            cmake -S . -B build -G Ninja
            cmake --build build --parallel 2>&1 | tee ../build.log
          elif [ -f "Makefile" ]; then
            echo "Makefile project detected"
            make -j$(nproc) 2>&1 | tee build.log
          else
            echo "Error: Neither CMakeLists.txt nor Makefile found!"
            exit 1
          fi

      - name: Debug Output Artifacts
        run: |
          echo "Finding generated firmware files:"
          find "projects/tarang-firmware/Initial Firmware/build" -name "*.elf"
          find "projects/tarang-firmware/Initial Firmware/build" -name "*.hex"
          find "projects/tarang-firmware/Initial Firmware/build" -name "*.bin"
          find "projects/tarang-firmware/Initial Firmware/build" -name "*.map"

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-artifacts
          if-no-files-found: warn
          path: |
            projects/tarang-firmware/Initial Firmware/build/build.log
            projects/tarang-firmware/Initial Firmware/build/**/*.elf
            projects/tarang-firmware/Initial Firmware/build/**/*.hex
            projects/tarang-firmware/Initial Firmware/build/**/*.bin
            projects/tarang-firmware/Initial Firmware/build/**/*.map
          retention-days: 10



