          stroke-linejoin="round" />
    <circle cx="28" cy="14" r="2.5" fill="#FFFFFF" />
  </g>

  <!-- Brand Typography -->
  <text x="80" y="38" font-family="Geist, system-ui, sans-serif" font-weight="800" font-size="24" fill="#131B2E" letter-spacing="-0.5">TARANG</text>
  <text x="180" y="38" font-family="Geist, system-ui, sans-serif" font-weight="600" font-size="24" fill="#006A61" letter-spacing="-0.5">CLINICAL</text>
  <text x="81" y="55" font-family="JetBrains Mono, monospace" font-weight="600" font-size="9" fill="#3E4947" letter-spacing="1.5">CARDIAC TELEMETRY WORKSTATION</text>
</svg>
